<html lang="en">
<head>

  <title>My Simple Website</title>

    :root {
      --bg: #f7f8fb;
      --card: #ffffff;

      --muted: #6b7280;
      --rounded: 12px;
      --maxw: 1000px;

    .wrap { max-width:var(--maxw); margin:32px auto; padding:20px; }

    }
    nav { display:flex; gap:14px; align-items:center; }
    .nav-link { text-decoration:none; color:var(--muted); font-weight:600; }
    .cta { background:var(--accent); color:white; padding:8px 12px; border-radius:10px; text-decoration:none; font-weight:600; }

    .hero {
      background: linear-gradient(180deg, rgba(255,255,255,0.8), rgba(255,255,255,0.6));

    }

    .hero p { margin:0 0 18px; color:var(--muted); }

    .card {
